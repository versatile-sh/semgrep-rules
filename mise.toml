[tools]
node = "24.22.0"

[tasks.test]
description = "Validate the rules and run their test cases in tests/"
run = [
  "semgrep --validate --metrics=off --disable-version-check --config rules/versatile.yml",
  "for f in tests/*; do semgrep --test --metrics=off --disable-version-check --config rules/versatile.yml \"$f\" || exit 1; done",
]

[tasks.semgrep]
description = "Scan this repository with p/secrets and the Versatile rules"
run = "semgrep scan --metrics=off --disable-version-check --error --severity WARNING --severity ERROR --config p/secrets --config rules/versatile.yml"

[tasks.lint]
description = "README lint"
dir = "docs/assets/src"
run = ["npm ci --silent", "npm run --silent lint"]

[tasks.images]
description = "Regenerate the README images in docs/assets"
dir = "docs/assets/src"
run = ["npm ci", "node build-banners.mjs"]

[tasks.check]
description = "Local merge validation: rule tests, Semgrep, README lint"
run = [{ task = "test" }, { task = "semgrep" }, { task = "lint" }]
