name: semgrep
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - run: pip install semgrep==1.183.0
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a
        with:
          install: false
      - run: mise run --skip-tools test
      - run: mise run --skip-tools semgrep
