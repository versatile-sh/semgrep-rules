version: 2
updates:
  - package-ecosystem: npm
    directory: "/docs/assets/src"
    ignore:
      - dependency-name: "opentype.js"
        versions: [">=2.0.0"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
